openapi: 3.0.3
info:
  title: Shopizer Guest Checkout (Existing v1 Contract)
  version: 3.2.7
  description: Source-derived summary of the existing Shopizer guest checkout endpoint.
paths:
  /api/v1/cart/{code}/checkout:
    post:
      summary: Check out a cart without signing in
      description: Resolves the cart within the current merchant context and returns an order confirmation.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: store
          in: query
          required: false
          schema:
            type: string
            default: DEFAULT
        - name: lang
          in: query
          required: false
          schema:
            type: string
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersistableAnonymousOrder'
      responses:
        '200':
          description: Order was processed and a confirmation was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadableOrderConfirmation'
        default:
          description: Checkout could not be completed; exact error mapping is provided by Shopizer's global exception handler.
components:
  schemas:
    PersistableAnonymousOrder:
      type: object
      required: [customer, payment]
      properties:
        id:
          type: integer
          format: int64
        customerAgreement:
          type: boolean
        comments:
          type: string
        currency:
          type: string
        customer:
          $ref: '#/components/schemas/GuestCustomer'
        payment:
          $ref: '#/components/schemas/Payment'
        shippingQuote:
          type: integer
          format: int64
    GuestCustomer:
      type: object
      required: [emailAddress]
      properties:
        emailAddress:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        language:
          type: string
        billing:
          $ref: '#/components/schemas/Address'
        delivery:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
    Payment:
      type: object
      required: [amount, paymentType, transactionType, paymentModule]
      properties:
        amount:
          type: string
          description: Must equal the server-recalculated cart total.
        paymentType:
          type: string
          example: MONEYORDER
        transactionType:
          type: string
          example: AUTHORIZECAPTURE
        paymentModule:
          type: string
          example: moneyorder
        paymentToken:
          type: string
    ReadableOrderConfirmation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billing:
          type: object
        delivery:
          type: object
        shipping:
          type: string
        payment:
          type: string
        total:
          type: object
        products:
          type: array
          items:
            type: object
